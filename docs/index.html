<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星芽阅读 · 古诗启蒙</title>
  <style>
    :root { --ink:#273246; --blue:#2f4f7a; --paper:#f7f4ee; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:2rem 1rem 3rem;
      font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#dce7f5 0,var(--paper) 24rem);
    }
    .wrap { width:min(720px,100%); margin:0 auto; }
    h1 { margin:0 0 .5rem; color:var(--blue); font-size:clamp(2rem,6vw,3rem); }
    p.lead { margin:0 0 2rem; font-size:1.15rem; line-height:1.7; }
    .list { display:grid; gap:1rem; }
    a.card {
      display:block; padding:1.2rem 1.4rem; border-radius:20px;
      background:#fff; border:2px solid rgba(47,79,122,.12);
      box-shadow:0 10px 28px rgba(47,64,96,.08);
      color:inherit; text-decoration:none;
    }
    a.card:hover { transform:translateY(-2px); }
    a.card h2 { margin:0 0 .35rem; color:var(--blue); font-size:1.35rem; }
    a.card p { margin:0; color:#657089; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>星芽阅读</h1>
    <p class="lead">面向 3–6 岁的古诗动画启蒙。点下面任意一课，即可在浏览器里互动学习。</p>
    <div class="list">
      <a class="card" href="./jing-ye-si/">
        <h2>《静夜思》· 唐 · 李白</h2>
        <p>小小月亮想家课 · 故事动画 · 情感朗读 · 点一点互动</p>
      </a>
      <a class="card" href="./song-du-shao-fu/">
        <h2>《送杜少府之任蜀州》· 唐 · 王勃</h2>
        <p>小小友情旅行课 · 故事动画 · 情感朗读 · 点一点互动</p>
      </a>
    </div>
  </div>
</body>
</html>
